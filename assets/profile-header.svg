<rect width="900" height="210" rx="12" fill="#111713"/>
<rect width="900" height="210" rx="12" fill="url(#grid)"/>
<rect x=".5" y=".5" width="899" height="209" rx="12" fill="none" stroke="#2c3830"/>
<path d="M214 48V163" stroke="#344136"/>
<g font-family="Consolas, 'Liberation Mono', monospace">
<text x="46" y="130" font-size="68" font-weight="400" fill="#bfcca6">&lt;<tspan fill="#819e88">/</tspan>&gt;</text>
<text x="252" y="70" font-size="13" letter-spacing="4" fill="#9daf93">DEVELOPER</text>
<text x="249" y="126" font-size="43" font-weight="700" letter-spacing="-1.5" fill="#e3e8d7">build<tspan fill="#afc292">.</tspan> learn<tspan fill="#afc292">.</tspan> repeat<tspan fill="#afc292">.</tspan></text>
